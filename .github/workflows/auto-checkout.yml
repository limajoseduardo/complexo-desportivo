name: Auto Checkout (20h00 + Fecho de Almoço 13h-15h Verão)

on:
  schedule:
    # 19:00 e 20:00 UTC cobrem as 20h00 de Lisboa tanto em hora de verão (WEST, UTC+1)
    # como em hora de inverno (WET, UTC+0) — o script só atua na corrida certa.
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
    # 12:00 e 13:00 UTC cobrem as 13h00 de Lisboa (fecho de almoço, só ativo na
    # temporada de Verão). A Piscina Exterior não é afetada (bilhete de dia inteiro).
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar checkout imediato (ignora verificação de hora)'
        type: boolean
        default: false
      mode:
        description: 'Modo a forçar quando "force" está ativo'
        type: choice
        options: [night, lunch]
        default: night

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx tsx scripts/auto-checkout.ts
        env:
          FORCE_CHECKOUT: ${{ inputs.force }}
          CHECKOUT_MODE: ${{ inputs.mode }}
